<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How was your tattoo?</title>
</head>
<body style="margin:0;background:#0A0A0A;color:#F2EEE8;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0A0A0A;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#121212;border:1px solid #2a2825;">
          <tr>
            <td style="padding:32px 28px 8px;font-family:Georgia,'Times New Roman',serif;font-size:22px;color:#F2EEE8;">Thank you for trusting the craft</td>
          </tr>
          <tr>
            <td style="padding:16px 28px 28px;font-size:14px;line-height:1.65;color:#E8E0D5;">
              <p style="margin:0 0 16px;">Hello {{client_first_name}},</p>
              <p style="margin:0 0 16px;">If you appreciated your experience with Lex, honest feedback helps other collectors find intentional work.</p>
              <p style="margin:0 0 12px;"><a href="{{review_link}}" style="color:#F2EEE8;">Leave a review</a></p>
              <p style="margin:0;color:#9A9087;font-size:13px;">{{studio_address}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
